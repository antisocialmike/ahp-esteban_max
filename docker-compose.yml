services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DB_CLIENT: ${DB_CLIENT:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      PORT: 3000
      DB_FILE: /app/data/ahp.sqlite
      SESSION_DB_FILE: sessions.sqlite
      SESSION_DB_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-secret}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-ahp:sess:}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
    volumes:
      - ./:/app:cached
      - ./data:/app/data
      - /app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - cloud-ready
    environment:
      POSTGRES_DB: ahp
      POSTGRES_USER: ahp
      POSTGRES_PASSWORD: ahp_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ahp -d ahp']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles:
      - cloud-ready
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    profiles:
      - cloud-ready
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    profiles:
      - cloud-ready
    depends_on:
      - minio
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-ahp-uploads}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb -p local/$${S3_BUCKET} || true
        mc anonymous set public local/$${S3_BUCKET} || true

volumes:
  postgres_data:
  redis_data:
  minio_data:
